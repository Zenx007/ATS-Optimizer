services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats-optimizer-api
    env_file:
      - .env
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      PDF2HTMLEX_BIN: pdf2htmlEX
    volumes:
      - api_storage:/app/storage
    restart: unless-stopped

volumes:
  api_storage:
